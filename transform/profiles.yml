# For a local run only (Databricks jobs and the dbt task do not read it). Host and token are fake.
sample_shop:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: demo
      schema: update_repos_sample
      host: sample.cloud.databricks.example
      http_path: /sql/1.0/warehouses/sample
      # A token written in the repository (DBT-006): read it with env_var('DBT_ACCESS_TOKEN').
      token: sample-not-a-real-token
