# The expected answers of this evaluation project (format: dbx_modernizer, src/dbx_modernizer/evaluation/cases.py).
# EXPECTED.md is generated from this file: edit here, then render.
# Objects: a repository path, table:<name>, job:<bundle key or job name>, bundle:<name>, endpoint:<name>,
# index:<name>, function:<name>, project.
version: 1
project: update_repos_sample

# Written to Databricks guidance: anything reported on them is a false positive.
clean_files:
  - src/clean/call_partner_api.py
  - src/clean/clean_events_tz.py
  - src/clean/dates.py
  - src/clean/gold_kpis_pipeline.py
  - src/clean/ingest_orders_autoloader.py
