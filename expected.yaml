# What dbx_modernizer should find in this example (format: src/dbx_modernizer/evaluation/cases.py of the agent).
# EXPECTED.md is generated from this file: edit here, then render.
# Objects: a repository path, table:<name>, job:<bundle key or job name>, bundle:<name>, volume:<c.s.v>,
# airflow_dag:<dag_id>, project.
# The larger evaluation set of earlier versions is the tag eval-v1 of this repository.
version: 2
project: update_repos_sample

# Written to Databricks guidance: anything reported on them is a false positive.
clean_files:
  - transform/models/staging/stg_orders.sql
  - transform/models/staging/stg_customers.sql
  - transform/models/marts/customer_orders.sql
  - tests/test_frames.py

cases:
  # --- Step 1, inventory --------------------------------------------------------------------------------------
  - {id: I-widgets, step: inventory, expect: report, title: Volume path built from widgets and an f-string,
     object: src/ingest/load_orders.py, table: inv_io, where: {api: spark.read.load},
     expect_row: {target: /Volumes/demo/update_repos_sample/raw/orders, resolved: true}}
  - {id: I-dag, step: inventory, expect: report, title: The Airflow DAG is an object of the graph,
     object: airflow_dag:shop_nightly, table: inv_nodes, expect_row: {status: present, layer: 2-orchestration}}
  - {id: I-inputs, step: inventory, expect: report, title: The raw files the job loads are in the volume,
     object: volume:demo.update_repos_sample.raw, table: inv_facts, where: {metric: data_source_files},
     expect_row: {probe: data_sources}}

  # --- Step 2, rules: must report -----------------------------------------------------------------------------
  - {id: R-SEC-001, step: rules, expect: report, level: 0, rule: SEC-001,
     title: Password written in a notebook run by hand, object: src/ops/export_partner.py}
  - {id: R-BUNDLE-005, step: rules, expect: report, level: 0, rule: BUNDLE-005,
     title: Production target without run_as a service principal, object: bundle:update_repos_sample}
  - {id: R-DBT-006, step: rules, expect: report, level: 0, rule: DBT-006,
     title: Token written in the dbt profile, object: transform/profiles.yml}
  - {id: R-PII-001, step: rules, expect: report, level: 1, rule: PII-001,
     title: Email and phone without a column mask, object: table:demo.update_repos_sample.customers}
  - {id: R-IO-001, step: rules, expect: report, level: 2, rule: IO-001,
     title: Write in a try whose except swallows the error, object: src/ingest/load_orders.py}
  - {id: R-IO-004, step: rules, expect: report, level: 2, rule: IO-004,
     title: "Append write, not idempotent", object: src/ingest/load_orders.py}
  - {id: R-IO-006, step: rules, expect: report, level: 2, rule: IO-006,
     title: CSV read without a schema, object: src/ingest/load_orders.py}
  - {id: R-DBT-002, step: rules, expect: report, level: 2, rule: DBT-002,
     title: Incremental model merged without unique_key, object: transform/models/marts/daily_revenue.sql}
  - {id: R-DBT-003, step: rules, expect: report, level: 2, rule: DBT-003,
     title: A model without tests, object: transform/dbt_project.yml}
  - {id: R-DBT-004, step: rules, expect: report, level: 2, rule: DBT-004,
     title: A source without freshness, object: transform/dbt_project.yml}
  - {id: R-JOB-004, step: rules, expect: report, level: 3, rule: JOB-004,
     title: "Job without retries, timeout or failure notification", object: job:ingest}
  - {id: R-GOV-001, step: rules, expect: report, level: 4, rule: GOV-001,
     title: Table without description, object: table:demo.update_repos_sample.orders_raw}
  - {id: R-CODE-003-udf, step: rules, expect: report, level: 5, rule: CODE-003,
     title: Python UDF where a native function exists, object: src/ingest/load_customers.py}
  - {id: R-CODE-003-collect, step: rules, expect: report, level: 5, rule: CODE-003,
     title: Whole table collected to the driver, object: src/prepare/clean_orders.py}
  - {id: R-LIB-001, step: rules, expect: report, level: 7, rule: LIB-001,
     title: pandas pinned to two versions (requirements.txt and a notebook), object: project}

  # --- Step 2, rules: must not report ---------------------------------------------------------------------------
  - {id: R-NOT-IO-007, step: rules, expect: not_report, level: 2, rule: IO-007,
     title: The raw files the job reads are there, object: volume:demo.update_repos_sample.raw}
  - {id: R-NOT-IO-006, step: rules, expect: not_report, level: 2, rule: IO-006,
     title: CSV read with a schema, object: src/ingest/load_customers.py}
  - {id: R-NOT-DBT-002, step: rules, expect: not_report, level: 2, rule: DBT-002,
     title: Incremental model merged on its key, object: transform/models/marts/customer_orders.sql}
  - {id: R-NOT-REF-001, step: rules, expect: not_report, level: 2, rule: REF-001,
     title: Every object the code uses exists, object: table:demo.update_repos_sample.orders_raw}

  # --- Step 2, model reviews ----------------------------------------------------------------------------------
  - {id: C-duplicates, step: code_review, expect: report, level: 2,
     title: Orders appended on each run are cleaned without removing duplicates,
     object: src/prepare/clean_orders.py, topic: 'duplicat|dedup|distinct|append'}
  - {id: C-NOT-password-repeat, step: code_review, expect: not_report, level: 0,
     title: "The password is a rule's finding, not repeated by the model", object: src/ops/export_partner.py,
     topic: 'password|credential|secret'}
  - {id: A-manual-export, step: architecture, expect: report, level: 3,
     title: "A notebook run by hand, in no job", object: src/ops/export_partner.py,
     topic: 'manual|by hand|not scheduled|no job|orphan'}
  - {id: A-NOT-orphan-frames, step: architecture, expect: not_report, level: 6,
     title: The shared helpers are imported by a notebook of the job, object: src/common/frames.py,
     topic: 'orphan|unused|not used|dead'}

  # --- Step 4, target design ----------------------------------------------------------------------------------
  - {id: T-ingest-job, step: target_design, expect: report, level: 2,
     title: One change for the ingest job and the code it runs, object: job:ingest, rules: [IO-001, JOB-004]}

  # --- Step 6, rewrite ------------------------------------------------------------------------------------------
  - {id: W-reraise, step: rewrite, expect: report, level: 2, rule: IO-001, title: Error raised again,
     object: src/ingest/load_orders.py, diff: '^\+\s+raise'}
  - {id: W-retries, step: rewrite, expect: report, level: 3, rule: JOB-004, title: Retries and timeouts in the bundle,
     object: resources/jobs.yml, diff: '^\+\s+max_retries:'}
  - {id: W-secret, step: rewrite, expect: report, level: 0, rule: SEC-001, title: Password read from a secret scope,
     object: src/ops/export_partner.py, diff: 'dbutils\.secrets\.get\('}
  - {id: W-upgrade-pandas, step: rewrite, expect: report, level: 7, rule: UPGRADE,
     title: pandas pinned to the latest stable version that installs with the rest, object: requirements.txt,
     diff: '^\+pandas==3\.'}
  - {id: W-adapt-frames, step: rewrite, expect: report, level: 7, rule: ADAPT,
     title: "is_text_column adapted to pandas 3, where text columns are of the str dtype, not object",
     object: src/common/frames.py, diff: '^\+.*(is_string_dtype|StringDtype|pd\.api\.types|"str"|\bstr\b)'}
  - {id: W-NOT-adapt-tests, step: rewrite, expect: not_report, rule: ADAPT,
     title: The code model never changes the project's tests, object: tests/test_frames.py, diff: '.'}

  # --- Step 6c, unit tests --------------------------------------------------------------------------------------
  - {id: U-frames-clean, step: unit_tests, expect: report, title: The country cleaning still passes,
     object: tests/test_frames.py, where: {test: "tests.test_frames::test_orders_frame_cleans_the_country"},
     expect_row: {before: passed, after: passed}}
  - {id: U-pandas3-adapted, step: unit_tests, expect: report, level: 7,
     title: "With is_text_column adapted to pandas 3, the text check still passes",
     object: tests/test_frames.py, where: {test: "tests.test_frames::test_country_is_text"},
     expect_row: {before: passed, after: passed}}

  # --- Step 6c, what the integration test runs (computed, nothing is run) ---------------------------------------
  - {id: P-job-order, step: integration_plan, expect: report, title: The job's cleaning runs after both loads,
     object: job:ingest, where: {task_key: clean_orders}, expect_row: {kind: notebook, runnable: true}}
  - {id: P-dag-outside, step: integration_plan, expect: report, title: The Bash task runs in Airflow and is only listed,
     object: airflow:shop_nightly, where: {task_key: fetch_partner_rates},
     expect_row: {kind: airflow, runnable: false, outside: true}}
  - {id: P-dag-runnow, step: integration_plan, expect: report,
     title: "The DAG triggers the bundle's job by name, which is tested once with the bundle",
     object: airflow:shop_nightly, where: {task_key: ingest}, expect_row: {kind: run_job, runnable: false, outside: true}}
  - {id: P-dag-dbt, step: integration_plan, expect: report,
     title: "The DAG's dbt build (Git source, relative project directory) is replayed on a copy of transform/",
     object: airflow:shop_nightly, where: {task_key: dbt_build}, expect_row: {kind: dbt, runnable: true, depends_on: ingest}}
  - {id: P-NOT-dag-runnow-twice, step: integration_plan, expect: not_report,
     title: The triggered job's tasks are not replayed a second time under the DAG,
     object: airflow:shop_nightly, where: {task_key: ingest.load_orders}, expect_row: {kind: notebook}}
