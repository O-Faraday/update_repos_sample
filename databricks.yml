# The shop's bundle: its job and the variables of its schema.
bundle:
  name: update_repos_sample

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog of the shop's schema (set it per workspace, see README).
    default: demo
  schema:
    description: Schema of the shop's tables and of its raw files volume.
    default: update_repos_sample

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
