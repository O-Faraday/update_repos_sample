# A small synthetic shop, to show what dbx_modernizer does. Every name, value and credential in this
# repository is fake. EXPECTED.md lists what the agent should find, and why.
bundle:
  name: update_repos_sample

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog of the shop's schema (set it per workspace, see README).
    default: demo
  schema:
    description: Schema of the shop's tables and of its raw files volume.
    default: update_repos_sample

targets:
  dev:
    mode: development
    default: true
  # Production without run_as: the jobs would run as the person who deploys (BUNDLE-005).
  prod:
    mode: production
