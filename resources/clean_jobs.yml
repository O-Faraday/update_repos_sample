# Written to Databricks guidance: nothing here should be reported.
resources:
  jobs:
    clean_orders:
      name: sample_clean_orders
      # Scheduled, paused: nothing runs or costs until it is resumed.
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: Europe/Paris
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: ingest
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 3600
          notebook_task:
            notebook_path: ../src/clean/ingest_orders_autoloader.py
        - task_key: merge
          depends_on:
            - task_key: ingest
          max_retries: 2
          timeout_seconds: 3600
          notebook_task:
            notebook_path: ../src/clean/merge_orders_current.py
        - task_key: stream_events
          depends_on:
            - task_key: ingest
          max_retries: 2
          timeout_seconds: 3600
          notebook_task:
            notebook_path: ../src/clean/stream_events.py
