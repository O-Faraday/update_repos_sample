# The shop's job: raw files of the volume -> tables -> a clean table. No schedule (Airflow triggers it).
resources:
  jobs:
    # No retries, timeout or failure notification (JOB-004).
    ingest:
      name: sample_ingest
      tasks:
        - task_key: load_orders
          max_retries: 2
          timeout_seconds: 3600
          notebook_task:
            notebook_path: ../src/ingest/load_orders.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: load_customers
          max_retries: 2
          timeout_seconds: 3600
          notebook_task:
            notebook_path: ../src/ingest/load_customers.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: clean_orders
          max_retries: 2
          timeout_seconds: 3600
          depends_on:
            - task_key: load_orders
              max_retries: 2
              timeout_seconds: 3600
            - task_key: load_customers
              max_retries: 2
              timeout_seconds: 3600
          notebook_task:
            notebook_path: ../src/prepare/clean_orders.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
