resources:
  # No comment on the schema or its tables (GOV-001); owned by the deploying user (GOV-002).
  schemas:
    sample:
      catalog_name: ${var.catalog}
      name: ${var.schema}
  volumes:
    raw:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.sample.name}
      name: raw
